<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ViewCA</title>
    
    <!-- PWA Links -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#006A4E">
    <link rel="apple-touch-icon" href="https://picsum.photos/seed/viewca192/192/192">

    <style>
        :root {
            --primary: #006A4E; /* Vert Mada */
            --secondary: #64748b;
            --accent: #FC3D32; /* Rouge Mada */
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef2f6;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            color: var(--text);
            overflow: hidden;
        }

        /* Container Mobile */
        #app {
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Header */
        header {
            background: var(--surface);
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.2rem; font-weight: 700; color: var(--primary); }
        .date-display { font-size: 0.85rem; color: var(--secondary); }

        /* Main Content */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            padding-bottom: 80px;
        }

        /* Navigation */
        nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 0.8rem 0;
            z-index: 20;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--secondary);
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 4px;
        }
        .nav-item.active { color: var(--primary); }
        .nav-icon { width: 24px; height: 24px; fill: currentColor; }

        /* Views */
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Product Cards */
        .product-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
        }
        .product-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .product-name { font-weight: 600; }
        .product-meta { font-size: 0.85rem; color: var(--secondary); }
        
        .stock-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            padding: 0.5rem;
            border-radius: 8px;
            margin-top: 0.5rem;
        }
        .stock-label { font-size: 0.8rem; font-weight: 600; }
        .stock-val { 
            font-size: 1.2rem; 
            font-weight: 700; 
            color: var(--primary); 
            min-width: 50px; 
            text-align: center; 
            background: white; 
            border-radius: 6px; 
            padding: 4px 8px; 
            border: 1px solid var(--border);
            cursor: pointer;
        }
        
        .btn-loss {
            font-size: 0.75rem;
            padding: 4px 8px;
            background: #fee2e2;
            color: var(--danger);
            border: none;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Dashboard */
        .chart-container {
            background: var(--surface);
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
        }
        .chart-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem; }
        canvas { width: 100%; height: 200px; display: block; }
        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .kpi-card { background: var(--surface); padding: 1rem; border-radius: var(--radius); text-align: center; box-shadow: var(--shadow); }
        .kpi-value { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
        .kpi-label { font-size: 0.8rem; color: var(--secondary); }

        /* Catalog Actions */
        .catalog-actions { display: flex; gap: 10px; margin-top: 8px; justify-content: flex-end; }
        .icon-btn { background: none; border: none; cursor: pointer; padding: 5px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: #f1f5f9; }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .btn-edit { color: var(--primary); }
        .btn-delete { color: var(--danger); }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 40;
            display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            background: var(--surface); width: 90%; max-width: 400px; padding: 1.5rem; border-radius: var(--radius);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.8rem; color: var(--secondary); margin-bottom: 0.3rem; }
        .form-input, .form-select { width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
        .btn-block { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; }
        .btn-secondary { background: var(--bg); color: var(--text); margin-top: 0.5rem; }
        .btn-danger { background: var(--danger); color: white; margin-top: 0.5rem; }

        /* Numpad */
        #numpad-modal {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--surface);
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
            transform: translateY(100%); transition: transform 0.3s ease; z-index: 50;
        }
        #numpad-modal.open { transform: translateY(0); }
        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 1rem; }
        .num-btn { background: var(--bg); border: none; padding: 1rem; border-radius: 8px; font-size: 1.5rem; font-weight: 600; }
        .num-btn:active { background: #e2e8f0; }
        .num-btn.action { background: var(--primary); color: white; }
        .num-btn.cancel { background: var(--danger); color: white; }
        .numpad-display { text-align: center; font-size: 2.5rem; font-weight: 700; color: var(--text); border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }

        /* Utilities */
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .badge-loss { background: #fee2e2; color: var(--danger); margin-left: 8px; }
        .fab {
            position: absolute; bottom: 80px; right: 20px; width: 56px; height: 56px;
            background: var(--primary); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 106, 78, 0.4);
            font-size: 2rem; border: none; cursor: pointer; z-index: 15;
        }
        /* Toast */
        #toast {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 10px 20px; border-radius: 20px;
            font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="app">
    <!-- Header -->
    <header>
        <div>
            <h1>ViewCA</h1>
            <div class="date-display" id="current-date">--/--/----</div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 0.75rem; color: var(--secondary);">Session</div>
            <div style="font-weight: 600; color: var(--success);">En cours</div>
        </div>
    </header>

    <main>
        <!-- VIEW: INVENTORY -->
        <div id="view-inventory" class="view active">
            <div style="margin-bottom: 1rem; display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 5px;">
                <button class="badge" style="background: var(--primary); color: white; padding: 8px 12px;">Tout</button>
                <button class="badge" style="background: white; border: 1px solid var(--border); padding: 8px 12px;">Alertes</button>
                <button class="badge" style="background: white; border: 1px solid var(--border); padding: 8px 12px;">Fruits</button>
            </div>
            <div id="inventory-list"></div>
        </div>

        <!-- VIEW: DASHBOARD -->
        <div id="view-dashboard" class="view">
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-value" id="kpi-ca">0 Ar</div>
                    <div class="kpi-label">CA du Jour</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value" id="kpi-loss" style="color: var(--danger);">0 Ar</div>
                    <div class="kpi-label">Démarque (Pertes)</div>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Top Produits (Ventes)</div>
                <canvas id="chart-bar"></canvas>
            </div>

            <div class="chart-container">
                <div class="chart-title">Ratio Rentabilité</div>
                <div style="display: flex; align-items: center; justify-content: space-around;">
                    <canvas id="chart-pie" width="120" height="120" style="width: 120px; height: 120px;"></canvas>
                    <div style="font-size: 0.8rem;">
                        <div style="color: var(--success); font-weight: bold;">● Ventes</div>
                        <div style="color: var(--danger); font-weight: bold;">● Pertes</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW: CATALOG -->
        <div id="view-catalog" class="view">
            <div class="product-card">
                <h3 style="margin-top:0;">Ajouter un Produit</h3>
                <div class="form-group">
                    <label class="form-label">Nom du produit</label>
                    <input type="text" id="new-prod-name" class="form-input" placeholder="Ex: Riz 1kg">
                </div>
                <div class="form-group">
                    <label class="form-label">Prix de vente (Ar)</label>
                    <input type="number" id="new-prod-price" class="form-input" placeholder="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Catégorie</label>
                    <select id="new-prod-cat" class="form-select">
                        <option value="Fruits">Fruits & Légumes</option>
                        <option value="Epicerie">Épicerie</option>
                        <option value="Boissons">Boissons</option>
                        <option value="Frais">Frais</option>
                    </select>
                </div>
                <button class="btn-block" onclick="app.addProduct()">Enregistrer</button>
            </div>
            <h4 style="margin-bottom:10px;">Catalogue Actuel</h4>
            <div id="catalog-list"></div>
        </div>
    </main>

    <button class="fab" onclick="app.finishInventory()">✓</button>

    <nav>
        <button class="nav-item active" onclick="app.switchView('inventory', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            Inventaire
        </button>
        <button class="nav-item" onclick="app.switchView('dashboard', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
            Dashboard
        </button>
        <button class="nav-item" onclick="app.switchView('catalog', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            Catalogue
        </button>
    </nav>

    <!-- Custom Numpad -->
    <div id="numpad-modal">
        <div class="numpad-display" id="numpad-screen">0</div>
        <div class="numpad-grid">
            <button class="num-btn" onclick="numpad.press(1)">1</button>
            <button class="num-btn" onclick="numpad.press(2)">2</button>
            <button class="num-btn" onclick="numpad.press(3)">3</button>
            <button class="num-btn" onclick="numpad.press(4)">4</button>
            <button class="num-btn" onclick="numpad.press(5)">5</button>
            <button class="num-btn" onclick="numpad.press(6)">6</button>
            <button class="num-btn" onclick="numpad.press(7)">7</button>
            <button class="num-btn" onclick="numpad.press(8)">8</button>
            <button class="num-btn" onclick="numpad.press(9)">9</button>
            <button class="num-btn cancel" onclick="numpad.clear()">C</button>
            <button class="num-btn" onclick="numpad.press(0)">0</button>
            <button class="num-btn action" onclick="numpad.validate()">OK</button>
        </div>
    </div>

    <!-- Loss Modal -->
    <div id="loss-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="margin-top:0">Déclarer une anomalie</h3>
            <p id="loss-prod-name" style="color:var(--primary); font-weight:bold;">Produit</p>
            <input type="hidden" id="loss-prod-id">
            <div class="form-group">
                <label class="form-label">Quantité perdue</label>
                <input type="number" id="loss-qty" class="form-input" value="1" min="1">
            </div>
            <div class="form-group">
                <label class="form-label">Raison</label>
                <select id="loss-reason" class="form-select">
                    <option value="Casse">Casse</option>
                    <option value="Péremption">Date péremption</option>
                    <option value="Vol">Vol</option>
                    <option value="Perso">Usage personnel</option>
                </select>
            </div>
            <button class="btn-block" onclick="app.saveLoss()">Valider la perte</button>
            <button class="btn-block btn-secondary" onclick="app.closeLossModal()" style="border:none;">Annuler</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="margin-top:0">Modifier le Produit</h3>
            <input type="hidden" id="edit-prod-id">
            <div class="form-group">
                <label class="form-label">Nom</label>
                <input type="text" id="edit-prod-name" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Prix (Ar)</label>
                <input type="number" id="edit-prod-price" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Catégorie</label>
                <select id="edit-prod-cat" class="form-select">
                    <option value="Fruits">Fruits & Légumes</option>
                    <option value="Epicerie">Épicerie</option>
                    <option value="Boissons">Boissons</option>
                    <option value="Frais">Frais</option>
                </select>
            </div>
            <button class="btn-block" onclick="app.saveEdit()">Sauvegarder</button>
            <button class="btn-block btn-secondary" onclick="app.closeEditModal()" style="border:none;">Annuler</button>
        </div>
    </div>

    <div id="toast">Message</div>
</div>

<script>
/**
 * SIMPLE CHARTING LIBRARY
 */
const Charts = {
    drawBar(canvasId, data, labels) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const w = canvas.width = canvas.offsetWidth;
        const h = canvas.height = canvas.offsetHeight;
        const padding = 20;
        ctx.clearRect(0,0,w,h);
        const max = Math.max(...data) * 1.1 || 100;
        const barWidth = (w - padding * 2) / data.length - 10;

        data.forEach((val, i) => {
            const barHeight = (val / max) * (h - padding * 2);
            const x = padding + i * (barWidth + 10);
            const y = h - padding - barHeight;
            ctx.fillStyle = '#10b981'; ctx.fillRect(x, y, barWidth, barHeight);
            ctx.fillStyle = '#64748b'; ctx.font = '10px Arial';
            ctx.fillText(labels[i].substring(0,3), x, h - 5);
        });
    },
    drawPie(canvasId, dataValues, dataColors) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const w = canvas.width = canvas.offsetWidth;
        const h = canvas.height = canvas.offsetHeight;
        const total = dataValues.reduce((a,b)=>a+b, 0);
        let startAngle = 0;
        ctx.clearRect(0,0,w,h);
        const centerX = w/2, centerY = h/2, radius = Math.min(w,h)/2 - 5;

        dataValues.forEach((val, i) => {
            const sliceAngle = (val / total) * 2 * Math.PI;
            ctx.beginPath(); ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
            ctx.fillStyle = dataColors[i]; ctx.fill();
            startAngle += sliceAngle;
        });
        ctx.beginPath(); ctx.arc(centerX, centerY, radius * 0.6, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff'; ctx.fill();
    }
};

/**
 * APP LOGIC
 */
const app = {
    data: {
        products: [],
        inventory: {},
        previousStock: {},
        losses: {}
    },

    formatMoney(amount) {
        return Math.round(amount).toLocaleString('fr-FR') + ' Ar';
    },

    init() {
        const today = new Date();
        document.getElementById('current-date').textContent = today.toLocaleDateString('fr-FR');
        this.loadData();
        this.renderInventory();
        this.renderCatalog();
        this.renderDashboard();
    },

    // --- CHANGEMENT LOCALSTORAGE : CHARGEMENT ---
    loadData() {
        const storedData = localStorage.getItem('viewca_data');
        
        if (storedData) {
            // Si des données existent déjà (PERSISTANCE), on les utilise
            this.data = JSON.parse(storedData);
        } else {
            // Sinon (Première visite), on charge les données de démo
            this.data.products = [
                { id: 1, name: 'Pommes Golden (kg)', price: 4500, category: 'Fruits', stock: 20, minStock: 5 },
                { id: 2, name: 'Baguette Bio', price: 800, category: 'Frais', stock: 15, minStock: 5 },
                { id: 3, name: 'Lait 1L', price: 3500, category: 'Frais', stock: 10, minStock: 4 },
                { id: 4, name: 'Eau Minérale 1.5L', price: 1200, category: 'Boissons', stock: 50, minStock: 10 },
                { id: 5, name: 'Chips 150g', price: 2500, category: 'Epicerie', stock: 8, minStock: 3 }
            ];

            this.data.previousStock = { 1: 25, 2: 10, 3: 12, 4: 45, 5: 10 };
            this.data.inventory = { ...this.data.previousStock };
            this.data.losses = { 1: { qty: 2, reason: 'Péremption' } }; 
        }
    },

    // --- CHANGEMENT LOCALSTORAGE : SAUVEGARDE ---
    saveData() {
        localStorage.setItem('viewca_data', JSON.stringify(this.data));
    },

    switchView(viewName, btn) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById('view-' + viewName).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(btn) btn.classList.add('active');
        if(viewName === 'dashboard') this.renderDashboard();
        if(viewName === 'catalog') this.renderCatalog();
    },

    renderInventory() {
        const container = document.getElementById('inventory-list');
        container.innerHTML = '';
        this.data.products.forEach(p => {
            const currentStock = this.data.inventory[p.id];
            const prevStock = this.data.previousStock[p.id];
            const loss = this.data.losses[p.id];
            
            const diff = prevStock - currentStock;
            const lossQty = loss ? loss.qty : 0;
            const sales = Math.max(0, diff - lossQty);
            const ca = sales * p.price;
            
            const lossHtml = loss ? `<span class="badge badge-loss">- ${loss.qty} (${loss.reason})</span>` : '';

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-header">
                    <div>
                        <div class="product-name">${p.name} ${lossHtml}</div>
                        <div class="product-meta">${p.category} | Prix: ${this.formatMoney(p.price)}</div>
                    </div>
                </div>
                <div class="stock-control">
                    <span class="stock-label">Stock Actuel (Cliquez pour modifier)</span>
                    <div class="stock-val" onclick="numpad.open(${p.id})">${currentStock}</div>
                </div>
                <div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);">
                    <div style="font-size:0.8rem; color:var(--secondary); margin-bottom:2px;">Calcul Auto : (Hier ${prevStock} - Actuel ${currentStock}) - Pertes ${lossQty}</div>
                    <div style="font-size:0.9rem; color:var(--success); font-weight:bold;">
                        Ventes estimées : ${sales} unités = ${this.formatMoney(ca)}
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; margin-top:5px;">
                     <button class="btn-loss" onclick="app.openLossModal(${p.id})">
                        <span>⚠️ Signaler Perte</span>
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    },
    updateStock(id, value) {
        this.data.inventory[id] = parseInt(value);
        this.renderInventory();
        this.saveData(); // AJOUT LOCALSTORAGE
    },

    openLossModal(id) {
        const p = this.data.products.find(x => x.id === id);
        document.getElementById('loss-prod-name').textContent = p.name;
        document.getElementById('loss-prod-id').value = id;
        document.getElementById('loss-modal').classList.add('open');
    },
    closeLossModal() { document.getElementById('loss-modal').classList.remove('open'); },
    saveLoss() {
        const id = parseInt(document.getElementById('loss-prod-id').value);
        const qty = parseInt(document.getElementById('loss-qty').value);
        const reason = document.getElementById('loss-reason').value;
        if(qty > 0) {
            this.data.losses[id] = { qty, reason };
            this.showToast(`Perte enregistrée : ${qty} unité(s)`);
            this.renderInventory();
            this.closeLossModal();
            this.saveData(); // AJOUT LOCALSTORAGE
        }
    },

    // CATALOG CRUD
    renderCatalog() {
        const list = document.getElementById('catalog-list');
        list.innerHTML = '';
        this.data.products.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product-card';
            div.style.padding = '0.8rem'; div.style.marginBottom = '0.5rem';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:start;">
                    <div style="flex:1;">
                        <div style="font-weight:600;">${p.name}</div>
                        <div style="font-size:0.85rem; color:var(--secondary);">${this.formatMoney(p.price)} | ${p.category}</div>
                    </div>
                    <div class="catalog-actions">
                        <button class="icon-btn btn-edit" onclick="app.openEditModal(${p.id})">
                            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                        </button>
                        <button class="icon-btn btn-delete" onclick="app.deleteProduct(${p.id})">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                </div>`;
            list.appendChild(div);
        });
    },
    addProduct() {
        const name = document.getElementById('new-prod-name').value;
        const price = parseFloat(document.getElementById('new-prod-price').value);
        const cat = document.getElementById('new-prod-cat').value;
        if(name && price) {
            const newId = Math.max(...this.data.products.map(p => p.id), 0) + 1;
            this.data.products.push({ id: newId, name, price, category: cat, stock: 0, minStock: 5 });
            this.data.inventory[newId] = 0; this.data.previousStock[newId] = 0;
            document.getElementById('new-prod-name').value = '';
            document.getElementById('new-prod-price').value = '';
            this.showToast('Produit ajouté');
            this.renderCatalog();
            this.saveData(); // AJOUT LOCALSTORAGE
        }
    },
    deleteProduct(id) {
        if(confirm('Supprimer ce produit ?')) {
            this.data.products = this.data.products.filter(p => p.id !== id);
            delete this.data.inventory[id];
            delete this.data.previousStock[id];
            delete this.data.losses[id];
            this.showToast('Produit supprimé');
            this.renderCatalog();
            this.renderInventory();
            this.saveData(); // AJOUT LOCALSTORAGE
        }
    },
    openEditModal(id) {
        const p = this.data.products.find(x => x.id === id);
        document.getElementById('edit-prod-id').value = p.id;
        document.getElementById('edit-prod-name').value = p.name;
        document.getElementById('edit-prod-price').value = p.price;
        document.getElementById('edit-prod-cat').value = p.category;
        document.getElementById('edit-modal').classList.add('open');
    },
    closeEditModal() { document.getElementById('edit-modal').classList.remove('open'); },
    saveEdit() {
        const id = parseInt(document.getElementById('edit-prod-id').value);
        const name = document.getElementById('edit-prod-name').value;
        const price = parseFloat(document.getElementById('edit-prod-price').value);
        const cat = document.getElementById('edit-prod-cat').value;
        if(name && price) {
            const idx = this.data.products.findIndex(p => p.id === id);
            if(idx !== -1) {
                this.data.products[idx] = { ...this.data.products[idx], name, price, category: cat };
                this.showToast('Produit modifié');
                this.renderCatalog();
                this.renderInventory();
                this.closeEditModal();
                this.saveData(); // AJOUT LOCALSTORAGE
            }
        }
    },

    // DASHBOARD
    renderDashboard() {
        let totalCA = 0, totalLossValue = 0;
        const productSales = []; 

        this.data.products.forEach(p => {
            const prev = this.data.previousStock[p.id] || 0;
            const curr = this.data.inventory[p.id] || 0;
            const lossObj = this.data.losses[p.id];
            const lossQty = lossObj ? lossObj.qty : 0;
            const sales = Math.max(0, (prev - curr) - lossQty);
            
            totalCA += sales * p.price;
            totalLossValue += lossQty * p.price;
            if(sales > 0) productSales.push({ name: p.name, val: sales * p.price });
        });

        document.getElementById('kpi-ca').textContent = this.formatMoney(totalCA);
        document.getElementById('kpi-loss').textContent = this.formatMoney(totalLossValue);

        productSales.sort((a,b) => b.val - a.val);
        const top10 = productSales.slice(0, 10);
        Charts.drawBar('chart-bar', top10.map(x => x.val), top10.map(x => x.name));

        Charts.drawPie('chart-pie', [totalCA, totalLossValue], ['#10b981', '#ef4444']);
    },

    finishInventory() { this.showToast("Inventaire clôturé !"); },
    showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }
};

// Numpad Logic
const numpad = {
    currentId: null, currentValue: '',
    open(productId) {
        this.currentId = productId;
        this.currentValue = app.data.inventory[productId].toString();
        this.updateScreen();
        document.getElementById('numpad-modal').classList.add('open');
    },
    press(num) {
        if(this.currentValue === '0') this.currentValue = '';
        this.currentValue += num;
        this.updateScreen();
    },
    clear() { this.currentValue = '0'; this.updateScreen(); },
    updateScreen() { document.getElementById('numpad-screen').textContent = this.currentValue; },
    validate() {
        if(this.currentId !== null) {
            app.updateStock(this.currentId, this.currentValue);
            document.getElementById('numpad-modal').classList.remove('open');
        }
    }
};

document.addEventListener('DOMContentLoaded', () => { app.init(); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => console.log('Service Worker: Registered', reg))
      .catch((err) => console.log('Service Worker: Error: ', err));
  });
}
